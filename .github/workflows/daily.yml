name: Daily trending Short

on:
  schedule:
    # GitHub cron is UTC and can start late; 14:00 UTC is 10 AM EDT / 9 AM EST.
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the video but don't upload"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  make-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Make and upload video
        env:
          TIMEZONE: America/New_York
          PUBLISH_HOUR: "12"
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python make_video.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video
          path: build/final.mp4
          if-no-files-found: ignore
      - name: Save history
        if: success()
        run: |
          git config user.name "yt-bot"
          git config user.email "yt-bot@users.noreply.github.com"
          git add history.json 2>/dev/null || exit 0
          git diff --cached --quiet || git commit -m "Log today's video" && git push
